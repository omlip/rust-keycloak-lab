server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:8081; frame-src 'self' http://localhost:8081; img-src 'self'; form-action 'self' http://localhost:8081; frame-ancestors 'none'; base-uri 'none'" always;

    # Only this tiny callback document may be framed by this SPA. All application
    # pages keep DENY/frame-ancestors none; otherwise silent check-sso would hang.
    location = /silent-check-sso.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; frame-ancestors 'self'; base-uri 'none'" always;
        try_files $uri =404;
    }

    # Preserve the browser's Origin (including :8082) for Rust's CSRF checks.
    location ~ ^/(api(?:/|$)|oidc/catalog/callback$) {
        # OIDC callback query strings contain short-lived authorization codes.
        access_log off;
        proxy_pass http://cost-monitor:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location / { try_files $uri $uri/ /index.html; }
}
