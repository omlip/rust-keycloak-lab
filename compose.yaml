name: olaninc-iam-demo

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--spi-theme--static-max-age=-1", "--spi-theme--cache-themes=false", "--spi-theme--cache-templates=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Bootstrap-local-only-2026!
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
      SPA_ORIGIN: http://localhost:${FRONTEND_HTTP_PORT:-8080}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/olaninc-realm.json:/opt/keycloak/data/import/olaninc-realm.json:ro
      - ./infrastructure/keycloak/themes/ni2:/opt/keycloak/themes/ni2:ro
      - ./infrastructure/keycloak/truststores:/opt/keycloak/conf/truststores:ro
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\r\n\r\n\" >&3; grep -q \"200 OK\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ./catalog-services/backend
    environment:
      BIND_ADDRESS: 0.0.0.0:3000
      OIDC_ISSUER: http://localhost:8081/realms/olaninc
      OIDC_AUDIENCE: olaninc-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/olaninc/protocol/openid-connect/certs
      RUST_LOG: info
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./catalog-services/frontend
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  cost-monitor:
    profiles: ["cost-monitor"]
    build:
      context: .
      dockerfile: cost-monitor/Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0:8082
      PUBLIC_ORIGIN: http://localhost:8082
      OIDC_ISSUER: http://localhost:8081/realms/olaninc
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/olaninc
      API_BASE: http://backend:3000
      LOGIN_CLIENT_SECRET_FILE: /run/secrets/cost-monitor-login.secret
      CATALOG_CLIENT_SECRET_FILE: /run/secrets/cost-monitor.secret
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Cost Monitor <cost-monitor@olaninc.test>"
      # Explicit local-only exception: dummy AD emails are captured by Mailpit.
      ALLOW_UNVERIFIED_ALERT_EMAIL: "true"
    volumes:
      - ./.secrets/cost-monitor.secret:/run/secrets/cost-monitor.secret:ro
      - ./.secrets/cost-monitor-login.secret:/run/secrets/cost-monitor-login.secret:ro
    tmpfs:
      - /run/cost-monitor
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ad:
    profiles: ["ad"]
    build: ./infrastructure/active-directory
    hostname: dc
    domainname: ad.olaninc.test
    volumes:
      - samba-data:/var/lib/samba
      - ./.secrets/ad-credentials.json:/run/secrets/ad-credentials.json:ro
    networks:
      default:
        aliases:
          - dc.ad.olaninc.test
    healthcheck:
      test: ["CMD", "python3", "/opt/ad/healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  keycloak-data:
  mailpit-data:
  samba-data:
